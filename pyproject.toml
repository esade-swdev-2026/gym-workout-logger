[project]
name = "gym-workout-logger"
version = "0.1.0"
description = "Group project for Software Development for Business"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
gym-workout-logger = "gym_workout_logger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_workout_logger"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
