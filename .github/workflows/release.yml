# Publishes the final Docker image to GitHub Container Registry (GHCR)
# when the v1.1 tag is pushed.
name: release

on:
  push:
    tags:
      - "v1.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t gym-workout-logger .

      - name: Run the image
        run: docker run --rm gym-workout-logger --help

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the v1.1 image
        run: |
          docker tag gym-workout-logger ghcr.io/esade-swdev-2026/gym-workout-logger:v1.1
          docker push ghcr.io/esade-swdev-2026/gym-workout-logger:v1.1